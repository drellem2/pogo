# Supplementary sweep — NOT part of the §3 protocol, and not produced by the
# committed test. Measured by hand during the same session on the same harness
# build, after the pilot run showed a 32-byte single write submitting while an
# 85-byte one did not. Content was held uniform (token + 'x' padding, no
# punctuation) so the write's byte count was the only variable. Recorded here
# because it is the reason a short-probe re-test would reach the OPPOSITE
# conclusion from the one above.
chunk_size_sweep:
  method: "single write of N bytes (body + \\r) into the settled composer; submission read from the session transcript"
  results:
    - {bytes: 16, result: submitted}
    - {bytes: 24, result: submitted}
    - {bytes: 32, result: submitted}
    - {bytes: 40, result: submitted}
    - {bytes: 48, result: submitted}
    - {bytes: 56, result: submitted}
    - {bytes: 58, result: submitted}
    - {bytes: 60, result: submitted}
    - {bytes: 62, result: submitted}
    - {bytes: 63, result: submitted}
    - {bytes: 64, result: not-submitted}
    - {bytes: 65, result: not-submitted}
    - {bytes: 72, result: not-submitted}
    - {bytes: 80, result: not-submitted}
  threshold_bytes: 64
  note: >-
    Sharp boundary, no grey zone: every write of <= 63 bytes submitted and every
    write of >= 64 bytes did not. So the paste heuristic on 2.1.220 keys on the
    SIZE of the read() chunk, not on elapsed time between keystrokes. Real nudge
    bodies are a message plus the scheduler's "[scheduler id=... due=... fired=...]"
    metadata line and are far past 64 bytes, which is why the delay is
    load-bearing for production traffic.
