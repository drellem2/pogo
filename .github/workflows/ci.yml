# =============================================================================
# THIS WORKFLOW IS A SUBSET OF THE MERGE GATE. IT IS NOT THE MERGE GATE.
# =============================================================================
#
# The merge gate is `./build.sh`, which runs `./test.sh` on darwin, and the
# refinery will not merge a branch that fails it. This workflow runs a MINORITY
# of test.sh's rows, on ubuntu-latest. `bash scripts/ci-coverage.sh` counts the
# overlap from these two files on demand, and the `gate-scope` job below prints
# that count into every run of this workflow.
#
# So a green run here is not a second opinion on the gate, and the two cannot
# contradict each other about a commit — they are answering different questions
# about different rows on different operating systems. On 2026-08-14 that
# inference ("CI is green on that same commit ... so one of them is wrong about
# the tree that is about to be deployed") turned one unreproduced gate failure
# into a MAIN IS RED alarm four minutes before a nightly deploy, on a tree that
# was green throughout. mg-5fc8 is the incident; mg-82a6 is this notice.
#
# The remedy is NOT to widen this workflow until it matches. Several gate rows
# are darwin-specific, several stand up live daemons, and one drives the live
# fleet. Knowing the asymmetry is the remedy.
#
# The name below carries the same caveat, because the workflow name is what
# appears in `gh run list`, in a PR's checks list, and in the sentence "CI is
# green on that commit" — which is where the inference is actually made.
# =============================================================================
name: CI (subset of the merge gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # How much of the merge gate this workflow actually runs, printed into this
  # workflow's own output (mg-82a6). It is a job rather than a comment because a
  # comment is not in the artifact anyone reads: whoever opens a run — or reads
  # a report quoting one — sees a list of green jobs, and this is the one that
  # says what that green covers.
  #
  # It measures rather than restating a number, so it cannot go stale against
  # the two files it is measuring, and it exits 2 (failing this job, loudly)
  # rather than reporting a confident zero if either parse stops working.
  gate-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: This workflow is a SUBSET of the merge gate — here is how much
        run: bash scripts/ci-coverage.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    # The outer backstop, so the per-package budget is not the only bound here
    # (raised in review as mg-a3db advisory 1). Under the refinery, test.sh sits
    # inside defaultGateTimeout=60m, which kills with a diagnostic heartbeat
    # record rather than a panic dump — that argument is why 20m per package is
    # safe to choose. It did NOT transfer to this call site: outside the gate
    # there was nothing but GitHub's 360-minute job default, so raising the
    # per-package worst case from 10m to 20m widened an unbounded window.
    #
    # 45m: comfortably above the realistic worst case (one wedged package at its
    # 20m budget plus the rest of a suite that measures ~4m here), and an order
    # of magnitude below the 360m default, which is "no bound" in practice.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up test fixtures
        run: |
          mkdir -p _testdata/a-service/.git
          mkdir -p _testdata/b-service/.git

      # Bounded and classified by the same script test.sh uses (mg-a465,
      # gh#107) — one definition of the budget and one definition of the
      # report. CI is the MORE exposed of the two: these runners are slower
      # than the dev host, and nobody watches this one interactively, so an
      # unlabelled goroutine dump here is read by whoever opens the failed run
      # days later.
      - name: Test
        run: bash scripts/go-test-budget.sh ./...

  pi-e2e:
    # Live pi-provider integration tests (mg-3e7c): drive a real pi binary
    # through agent.Registry (argv-delivered initial task per gh #26 +
    # mid-session nudges) and in
    # headless --print --mode json form, against a localhost mock OpenAI
    # server — no API key, no external model traffic. pi is pinned to the
    # version the nudge dialect was calibrated against
    # (docs/investigations/pi-nudge-calibration.md); bump it deliberately and
    # re-check the calibration if pi's TUI changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.80.3

      - name: Run pi provider integration tests
        env:
          POGO_PI_E2E: "1"
        run: go test ./internal/pi/ -v -timeout 300s

  emacs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Run Emacs Lisp tests
        run: emacs/run-tests.sh

  nvim-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Run Neovim plugin tests
        run: nvim/test_nvim.sh

  bash-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the changelog coverage check resolves its
          # default range from the most recent tag (mg-7904).
          fetch-depth: 0

      - name: Run Bash shell integration tests
        run: shell/bashrc_test.sh

      - name: Run changelog fragment assembler tests
        run: scripts/assemble-changelog_test.sh

      - name: Run changelog coverage tests
        run: scripts/changelog-coverage_test.sh

      # Here rather than only in the gate because this suite's subject is a
      # cross-platform awk parse: the gate runs it against BSD awk on darwin and
      # this job runs the same file against gawk/mawk on ubuntu. A parser that
      # reports a different coverage number on the two hosts would be reporting
      # a difference between awks as a difference between the files.
      - name: Run CI-vs-gate coverage instrument tests
        run: scripts/ci-coverage_test.sh

  version-check:
    if: false  # Disabled — re-enable by removing this line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for duplicate version tag
        run: ./scripts/check-version.sh

  build:
    # Pure-Go cross-compile matrix: every cell builds on ubuntu-latest. The
    # cgo FSEvents watch backend that once forced darwin cells onto a native
    # macOS runner (mg-6222) is gone — the indexer is now timer-driven and
    # pure Go, so CGO_ENABLED=0 cross-builds darwin cleanly. See mg-5b0d.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            echo "Building $name for $GOOS/$GOARCH"
            go build -o /dev/null "./$cmd"
          done
