# THE SUBJECT REGISTRY for scripts/revision-probe.sh (mg-e2e6).
#
# Every line names a long-lived process whose behaviour is defined by committed
# code, and the checkout that defines it. The probe compares the process's START
# INSTANT against the commit dates in that checkout and reports what that
# comparison can and cannot establish — see "TWO AXES" in revision-probe.sh.
#
# WHY THIS FILE AND NOT FLAGS IN THE PLIST
#
# It is tracked, so adding a subject is armed by a MERGE plus the deploy
# runner's sync_src: no plist edit, no re-install, no `pogo`, no build. That is
# the same activation path the probe itself is on. A subject list living in
# com.pogo.revisionprobe.plist would only change when somebody re-ran the
# installer, which is the arming gap one layer down — and re-arming a witness by
# hand is the step that does not happen.
#
# FORMAT — four whitespace-separated fields, '#' comments, blank lines ignored
#
#   name   a short label; it keys the ledger line and the per-subject stamp
#          ($HOME/.pogo/revision-probe.stamp.<name>)
#   repo   the git checkout whose commits define this process's behaviour.
#          Leading ~/ or $HOME is expanded; nothing else is, and nothing is
#          eval'd — a file that arrives by merge into an unattended hourly job is
#          not a place to execute strings.
#   ref    the revision in that checkout to compare against: HEAD for a repo the
#          process runs from directly, a branch name where that is the thing
#          being tracked. HEAD is usually right here, because these programs run
#          the working tree and not a build artifact.
#   pattern
#          a FIXED SUBSTRING of the full command line, not a regex. A trailing
#          '$' anchors it to the END of the command line, which several of the
#          entries below need: '/dev/bridget/bridget' is a prefix of
#          '/dev/bridget/bridget-supervise', and two subjects silently
#          collapsing into one is a witness reporting the wrong process's age
#          under the right name.
#
# WHAT A SUBJECT LOOKS LIKE WHEN IT IS RIGHT
#
#   run `ps -Ao pid,etime,command | grep <pattern>` and read the command line
#   the process actually has. It is often NOT the path you would name from
#   memory: bridget-supervise runs as ~/.pogo/bin/bridget-supervise (a symlink),
#   while the reader it supervises runs as ~/dev/bridget/bridget.
#
# THE BLIND SPOT OF THIS FILE, stated because an enumeration's failure mode is
# always the same one and it is the failure mode of the thing this file fixes:
# A SUBJECT NOBODY ADDED IS A SUBJECT NOBODY WATCHES. The probe reports ABSENT
# for a row whose process has stopped, and NO-REGISTRY when this file is gone —
# both loudly — but it can say nothing at all about a long-lived process that is
# running on this box and has no row here. That is the same shape as the launchd
# registry's, and docs/design/drift-guards-design.md's "the population is NOT
# stationary" is about exactly it: the list grows when somebody remembers.
#
# So: when you add a supervised program, a poller or a daemon to this box, add it
# here in the same change. There is no check that will tell you that you did not.
#
# pogod IS DELIBERATELY ABSENT. It is the one subject on this box with the
# strong reading — GET /version returns a revision — and revision-probe.sh
# checks it on every run without needing a row here. Adding it would produce two
# alerts for one fact, and the weaker of the two would be the noisier.
#
# name                repo                      ref     pattern

# The bridget reader. ~/.pogo/bin/bridget is a SYMLINK into the repo, so the
# file on disk is always current and only the running process can be stale —
# which is why this is the process axis and not a file comparison. This subject
# is the measured instance in mg-e2e6: 2026-08-14, up 2d08h, predating two
# merged fixes, one of them functional, reported by nothing.
bridget               $HOME/dev/bridget         HEAD    /dev/bridget/bridget$

# The supervisor. It restarts the reader; nothing restarts IT, so a supervisor
# running old restart logic is the failure that hides the one above.
bridget-supervise     $HOME/dev/bridget         HEAD    /.pogo/bin/bridget-supervise$

# The notifier pollers. Both are KeepAlive launchd jobs running `while true;
# sleep` loops, so they are long-lived by construction and outlive any number of
# merges. NOTE THE EXTRA WEAKNESS HERE: they execute a DEPLOYED COPY under
# ~/.pogo/pogo-reminders/bin, not the repo, so a finding on these means "the
# repo has moved since this process started" and the remedy may be a deploy
# rather than a restart. The probe's report says so at the point of use.
notify-mail           $HOME/dev/pogo-reminders  HEAD    /pogo-reminders/bin/poll-mail.sh$
notify-gh-issues      $HOME/dev/pogo-reminders  HEAD    /pogo-reminders/bin/poll-gh-issues.sh$
